name: netoscope_integration_tests
description: >-
  Verifies Netoscope with third-party HTTP clients built on Dio or
  package:http (Retrofit, Chopper, gql_http_link). Not published.
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  chopper: ^8.7.1
  dio: ^5.11.1
  flutter:
    sdk: flutter
  gql: ^1.0.1
  gql_exec: ^1.0.0+1
  gql_http_link: ^1.2.0
  http: ^1.6.0
  netoscope:
    path: ../../
  retrofit: ^4.10.0

dev_dependencies:
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  retrofit_generator: ^10.3.3
