name: netoscope_shake
description: >-
  Shake-to-open support for Netoscope: opens the network inspector when the
  device is shaken.
version: 0.1.0
# Path dependency on netoscope until it is published; switch to a hosted
# version constraint before publishing this package.
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  netoscope:
    path: ../../
  sensors_plus: ^7.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
