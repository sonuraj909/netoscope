name: netoscope_example
description: Demonstrates Netoscope with Dio and package:http against an offline demo backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  dio: ^5.4.0
  flutter:
    sdk: flutter
  http: ^1.5.0
  netoscope:
    path: ../
  netoscope_native:
    path: ../packages/netoscope_native
  netoscope_notifications:
    path: ../packages/netoscope_notifications
  path_provider: ^2.1.5
  share_plus: ^12.0.2

dev_dependencies:
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
