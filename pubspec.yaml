name: netoscope
description: >-
  Network logger and HTTP inspector for Flutter. Logs Dio, http, GraphQL,
  WebSocket, SSE and gRPC traffic with an in-app inspector, secret redaction,
  timeline and N+1 detection.
version: 0.2.4
repository: https://github.com/sonuraj909/netoscope
issue_tracker: https://github.com/sonuraj909/netoscope/issues

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  dio: ^5.4.0
  flutter:
    sdk: flutter
  http: ^1.5.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

topics:
  - debugging
  - network
  - logging
  - http
  - dio

screenshots:
  - description: Request list with status, timing, tags and N+1 detection.
    path: screenshots/request_list.webp
  - description: Request details with headers and a redacted JSON body.
    path: screenshots/request_detail.webp
  - description: Collapsible JSON tree viewer in the dark theme.
    path: screenshots/json_tree.webp
  - description: Gantt timeline of overlapping calls.
    path: screenshots/timeline.webp
  - description: Traffic statistics with status breakdown and N+1 findings.
    path: screenshots/statistics.webp
