name: netoscope
description: >-
  Debug-time network logging and inspection for Flutter. Dio and package:http
  integrations, sensitive-data redaction, bounded history, JSON export and an
  optional in-app inspector.
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  dio: ^5.4.0
  flutter:
    sdk: flutter
  http: ^1.5.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

topics:
  - debugging
  - network
  - logging
  - http
  - dio
